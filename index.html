<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Orbit Rush.io</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#fff;font-family:system-ui,Arial}canvas{display:block;width:100%;height:100%}#ui{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:2;pointer-events:none;gap:10px}.box{background:#081525e8;border:1px solid #31506b;border-radius:12px;padding:9px 12px;box-shadow:0 8px 30px #0008}.brand{color:#63dcff;font-weight:900;font-size:18px}.event{text-align:center}.event b{color:#ffd34d}.event small{display:block;color:#9ab0c4}.gold{color:#ffd34d}.xp{width:190px;height:7px;background:#182a3c;border-radius:9px;margin-top:6px}.xp i{display:block;height:100%;width:0;background:#58e68c}button{border:1px solid #31506b;border-radius:10px;background:#0b1b2d;color:#fff;padding:9px 12px;font-weight:800;cursor:pointer}#buttons{position:fixed;right:12px;bottom:12px;z-index:3;display:flex;gap:7px}#toast{position:fixed;top:95px;left:50%;transform:translate(-50%,-10px);opacity:0;z-index:6;background:#0b1b2df5;border:1px solid #42647d;border-radius:12px;padding:10px 18px;font-weight:900;transition:.2s}#toast.on{opacity:1;transform:translate(-50%,0)}#flash{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;background:#63dcff18;transition:.15s}#flash.on{opacity:1}#flash b{font-size:clamp(32px,8vw,72px);text-shadow:0 0 35px currentColor}#menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#123756,#030812 65%);padding:20px}.card{width:min(520px,92vw);padding:30px;text-align:center;background:#081525f5;border:1px solid #315a79;border-radius:22px;box-shadow:0 25px 90px #000}.logo{font-size:clamp(44px,10vw,70px);font-weight:1000;letter-spacing:-4px;color:#63dcff}.sub{color:#aec1d1;line-height:1.5}.play{margin-top:18px;background:#59e68c;color:#03120a;border:0;padding:14px 30px;font-size:17px}.hint{margin-top:12px;color:#70889d;font-size:11px}@media(max-width:700px){.event{display:none}.box{padding:8px;font-size:11px}.brand{font-size:15px}.xp{width:130px}}</style></head><body><canvas id="game"></canvas><div id="ui"><div class="box"><div class="brand">◉ ORBIT RUSH</div><div>LV <b id="lv">1</b> · XP <b id="xp">0</b>/<b id="need">100</b> · ⚡<b id="speed">1.0</b>x</div><div class="xp"><i id="bar"></i></div></div><div class="box event"><b id="ev">CALM SPACE</b><small>Next twist: <span id="tm">20</span>s</small></div><div class="box" style="text-align:right">🏆 <b id="score">0</b><br><span class="gold">🪙 <b id="coins">0</b></span> · ✦ <b id="orbs">1</b></div></div><div id="buttons"><button id="sound">🔊 Sound</button><button id="pause">Ⅱ Pause</button></div><div id="toast"></div><div id="flash"><b id="flashText"></b></div><div id="menu"><div class="card"><div class="logo">ORBIT RUSH</div><p class="sub">Collect coins and orbit shards, grow stronger, bump bots and survive a new wild twist every 20 seconds.</p><button class="play" id="play">PLAY ARENA</button><div class="hint">WASD / Arrow Keys to move · SPACE to dash</div></div></div><script>const c=document.getElementById('game'),g=c.getContext('2d');let W,H,d=1;function resize(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();const k={},R=(a,b)=>Math.random()*(b-a)+a,cl=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);addEventListener('keydown',e=>{k[e.key.toLowerCase()]=1;if(e.code==='Space'){e.preventDefault();dash()}if(e.key==='Escape')pauseGame()});addEventListener('keyup',e=>k[e.key.toLowerCase()]=0);let running=false,paused=false,last=0,t=0,tw=20,ev=0,score=0,coins=0,xp=0,level=1,orbs=1,p,items=[],bots=[],parts=[],cam={x:0,y:0},audio,soundOn=true,dashOK=true;const evs=['CALM SPACE','COIN RAIN','LOW GRAVITY','CHAOS BOOST','HUNGRY ORBITS','SHRINK ZONE'];function tone(f,d=.08,type='sine'){if(!soundOn)return;if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),a=audio.createGain(),n=audio.currentTime;o.type=type;o.frequency.value=f;a.gain.setValueAtTime(.0001,n);a.gain.exponentialRampToValueAtTime(.04,n+.01);a.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(a);a.connect(audio.destination);o.start(n);o.stop(n+d+.02)}function toast(s){let z=document.getElementById('toast');z.textContent=s;z.className='on';clearTimeout(toast.x);toast.x=setTimeout(()=>z.className='',1300)}function burst(x,y,n=8){for(let i=0;i<n;i++)parts.push({x,y,vx:R(-140,140),vy:R(-140,140),life:R(.3,.8)})}function world(){return{w:Math.max(1800,W*1.7),h:Math.max(1100,H*1.7)}}function coin(){let q=world();items.push({type:0,x:R(40,q.w-40),y:R(40,q.h-40),r:7,a:R(0,6)})}function shard(){let q=world();items.push({type:1,x:R(50,q.w-50),y:R(50,q.h-50),r:9,a:R(0,6)})}function addxp(n){xp+=n;let need=100+(level-1)*70;while(xp>=need){xp-=need;level++;orbs++;p.spd+=8;score+=300;toast('✦ LEVEL UP! +1 ORBIT');tone(600,.1,'triangle');setTimeout(()=>tone(900,.13,'triangle'),90);burst(p.x,p.y,22);need=100+(level-1)*70}}function reset(){let q=world();p={x:q.w/2,y:q.h/2,r:18,spd:240,dash:0};items=[];bots=[];parts=[];score=coins=xp=0;level=orbs=1;t=0;tw=20;ev=0;dashOK=true;for(let i=0;i<10;i++){let b={x:R(50,q.w-50),y:R(50,q.h-50),r:R(15,22),spd:R(90,145),name:['Nova','Glitch','Mango','Byte','Vortex','Pixel','Echo','Rex','Comet','Lumen'][i]};if(dist(b,p)<300)b.x+=450;bots.push(b)}for(let i=0;i<90;i++)coin();for(let i=0;i<15;i++)shard();hud()}function dash(){if(!running||paused||!dashOK)return;dashOK=false;p.dash=.18;burst(p.x,p.y,12);tone(180,.12,'sawtooth');setTimeout(()=>dashOK=true,1000)}function twist(){ev=(ev+1)%evs.length;tw=20;document.getElementById('ev').textContent=evs[ev];let col=['#63dcff','#ffd34d','#b878ff','#ff6b86','#63e6b0','#d38aff'][ev];document.getElementById('flashText').textContent=evs[ev];document.getElementById('flashText').style.color=col;let f=document.getElementById('flash');f.className='on';setTimeout(()=>f.className='',800);tone(240,.12,'sawtooth');setTimeout(()=>tone(620,.18,'triangle'),100);if(ev===1){for(let i=0;i<45;i++)coin();toast('🪙 COIN RAIN!')}if(ev===2)toast('🌙 LOW GRAVITY!');if(ev===3)toast('⚡ CHAOS BOOST!');if(ev===4)toast('🌀 HUNGRY ORBITS!');if(ev===5)toast('🔻 SHRINK ZONE!')}function update(dt){let q=world();t+=dt;tw-=dt;if(tw<=0)twist();let mx=(k.d||k.arrowright?1:0)-(k.a||k.arrowleft?1:0),my=(k.s||k.arrowdown?1:0)-(k.w||k.arrowup?1:0),l=Math.hypot(mx,my)||1;mx/=l;my/=l;let m=ev===2?.72:ev===3?1.35:1;if(p.dash>0){m*=3.2;p.dash-=dt}p.x=cl(p.x+mx*p.spd*m*dt,30,q.w-30);p.y=cl(p.y+my*p.spd*m*dt,30,q.h-30);bots.forEach(b=>{let target=p,best=360;for(let it of items)if(it.type===0&&dist(b,it)<best){best=dist(b,it);target=it}let ax=target.x-b.x,ay=target.y-b.y,l=Math.hypot(ax,ay)||1;ax/=l;ay/=l;if(target===p){let a=Math.atan2(ay,ax)+Math.sin(t*1.7+b.spd)*.7;ax=Math.cos(a);ay=Math.sin(a)}let s=b.spd*(ev===2?.75:1)*(ev===3?1.3:1);b.x=cl(b.x+ax*s*dt,25,q.w-25);b.y=cl(b.y+ay*s*dt,25,q.h-25);if(dist(b,p)<b.r+p.r+Math.min(orbs,5)*2){if(orbs>1){orbs--;score+=75;addxp(18);burst(b.x,b.y,12);tone(110,.1,'square');b.x=R(50,q.w-50);b.y=R(50,q.h-50);toast('BOT BUMP! −1 ORBIT')}else{score=Math.max(0,score-150);p.x=q.w/2;p.y=q.h/2;burst(p.x,p.y,16);tone(90,.13,'square');toast('SHIELD BROKEN! FIND A SHARD')}}});for(let i=items.length-1;i>=0;i--){let it=items[i];it.a+=dt*5;if(ev===4&&it.type===0){let dd=dist(p,it);if(dd<220){let a=Math.atan2(p.y-it.y,p.x-it.x),f=170*(1-dd/220);it.x+=Math.cos(a)*f*dt;it.y+=Math.sin(a)*f*dt}}if(dist(p,it)<p.r+it.r+10){items.splice(i,1);if(it.type===0){coins++;score+=12;addxp(9);tone(720,.05,'triangle');burst(it.x,it.y,4);coin()}else{orbs++;score+=90;addxp(35);tone(450,.08,'triangle');setTimeout(()=>tone(900,.1),50);burst(it.x,it.y,10);toast('✦ ORBIT SHARD +1')}}}if(ev===5&&Math.hypot(p.x-q.w/2,p.y-q.h/2)>450&&Math.random()<dt){orbs=Math.max(1,orbs-1);toast('VOID DRAINED AN ORBIT')}parts.forEach(z=>{z.x+=z.vx*dt;z.y+=z.vy*dt;z.vx*=.97;z.vy*=.97;z.life-=dt});parts=parts.filter(z=>z.life>0);cam.x=cl(p.x-W/2,0,q.w-W);cam.y=cl(p.y-H/2,0,q.h-H);hud()}function hud(){let n=100+(level-1)*70;document.getElementById('lv').textContent=level;document.getElementById('xp').textContent=Math.floor(xp);document.getElementById('need').textContent=n;document.getElementById('bar').style.width=Math.min(100,xp/n*100)+'%';document.getElementById('speed').textContent=(p.spd/240).toFixed(1);document.getElementById('score').textContent=score;document.getElementById('coins').textContent=coins;document.getElementById('orbs').textContent=orbs;document.getElementById('tm').textContent=Math.ceil(tw)}function draw(){g.clearRect(0,0,W,H);let q=world();g.fillStyle='#07111f';g.fillRect(0,0,W,H);g.save();g.translate(-cam.x,-cam.y);g.strokeStyle='rgba(80,150,190,.11)';for(let X=0;X<q.w;X+=60){g.beginPath();g.moveTo(X,0);g.lineTo(X,q.h);g.stroke()}for(let Y=0;Y<q.h;Y+=60){g.beginPath();g.moveTo(0,Y);g.lineTo(q.w,Y);g.stroke()}g.strokeStyle='#2b6689';g.lineWidth=5;g.strokeRect(20,20,q.w-40,q.h-40);if(ev===5){g.beginPath();g.arc(q.w/2,q.h/2,450,0,7);g.strokeStyle='#c06bff77';g.lineWidth=8;g.stroke()}items.forEach(it=>{g.save();g.translate(it.x,it.y);g.rotate(it.a);if(it.type===0){g.fillStyle='#ffd34d';g.shadowBlur=15;g.shadowColor='#ffd34d';g.beginPath();g.arc(0,0,7,0,7);g.fill();g.shadowBlur=0;g.fillStyle='#765000';g.font='bold 9px Arial';g.textAlign='center';g.fillText('$',0,3)}else{g.fillStyle='#63dcff';g.shadowBlur=18;g.shadowColor='#63dcff';g.beginPath();for(let j=0;j<6;j++){let a=j*Math.PI/3;g.lineTo(Math.cos(a)*9,Math.sin(a)*9)}g.closePath();g.fill()}g.restore()});bots.forEach((b,i)=>{let col=['#ff6278','#b878ff','#5bea91'][i%3];g.fillStyle=col;g.shadowBlur=18;g.shadowColor=col;g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fill();g.shadowBlur=0;g.fillStyle='#fff';g.font='10px Arial';g.textAlign='center';g.fillText(b.name,b.x,b.y-b.r-8)});for(let i=0;i<orbs;i++){let a=t*2.4+i*Math.PI*2/orbs,ox=p.x+Math.cos(a)*43,oy=p.y+Math.sin(a)*43;g.strokeStyle='#63dcff55';g.beginPath();g.moveTo(p.x,p.y);g.lineTo(ox,oy);g.stroke();g.fillStyle='#72e6ff';g.shadowBlur=14;g.shadowColor='#37cfff';g.beginPath();g.arc(ox,oy,6,0,7);g.fill()}g.shadowBlur=25;g.shadowColor='#37cfff';g.fillStyle='#35bde9';g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();g.shadowBlur=0;g.strokeStyle='#e5fbff';g.lineWidth=3;g.stroke();g.fillStyle='#06101b';g.beginPath();g.arc(p.x-5,p.y-2,3,0,7);g.arc(p.x+5,p.y-2,3,0,7);g.fill();parts.forEach(z=>{g.globalAlpha=z.life;g.fillStyle='#fff';g.beginPath();g.arc(z.x,z.y,3,0,7);g.fill();g.globalAlpha=1});g.restore()}function loop(now){if(!running)return;let dt=Math.min(.035,(now-last)/1000||0);last=now;if(!paused)update(dt);draw();requestAnimationFrame(loop)}function pauseGame(){if(!running)return;paused=!paused;document.getElementById('pause').textContent=paused?'▶ Resume':'Ⅱ Pause';toast(paused?'PAUSED':'RESUMED')}document.getElementById('play').onclick=()=>{if(!audio)try{audio=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if(audio)audio.resume();document.getElementById('menu').style.display='none';running=true;reset();last=performance.now();requestAnimationFrame(loop)};document.getElementById('pause').onclick=pauseGame;document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 Sound':'🔇 Muted';if(soundOn)tone(600,.08)};</script></body></html>
